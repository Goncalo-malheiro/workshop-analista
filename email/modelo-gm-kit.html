<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>Gonçalo Malheiro</title>
<style>
  body { margin: 0; padding: 0; background-color: #F3EFE5; -webkit-text-size-adjust: 100%; }
  .gm-content p { margin: 0 0 16px 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 17px; line-height: 1.6; color: #1B2A4A; }
  .gm-content h1, .gm-content h2, .gm-content h3 { margin: 0 0 12px 0; font-family: Georgia, 'Times New Roman', serif; line-height: 1.25; color: #1B2A4A; }
  .gm-content ul, .gm-content ol { margin: 0 0 16px 0; padding-left: 22px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 17px; line-height: 1.6; color: #1B2A4A; }
  .gm-content a { color: #8F6122; }
  .gm-content img { max-width: 100% !important; height: auto !important; }
  @media (max-width: 620px) {
    .gm-outer { padding: 16px 10px 24px 10px !important; }
    .gm-card { padding: 24px 18px 18px 18px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#F3EFE5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F3EFE5;">
<tr><td align="center" class="gm-outer" style="padding:32px 16px 40px 16px;">
<!--[if mso]><table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
  <tr><td style="padding:0 4px 18px 4px;">
    <img src="https://workshop-analista.vercel.app/logo.png" alt="Gonçalo Malheiro" width="124" style="display:block;width:124px;height:auto;border:0;">
  </td></tr>
  <tr><td class="gm-card gm-content" style="background-color:#FFFFFF;border:1px solid #E3DCCB;border-radius:16px;padding:32px 32px 22px 32px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;line-height:1.6;color:#1B2A4A;">
    {{ message_content }}
  </td></tr>
  <tr><td style="padding:20px 12px 0 12px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.7;color:#6B7287;text-align:center;">
    Recebes este email porque te inscreveste na lista do Gonçalo Malheiro.<br>
    <a href="{{ unsubscribe_url }}" style="color:#6B7287;text-decoration:underline;">Cancelar subscrição</a> &middot; <a href="{{ subscriber_preferences_url }}" style="color:#6B7287;text-decoration:underline;">Preferências</a><br>
    {{ address }}
  </td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr>
</table>
</body>
</html>
